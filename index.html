<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Money Calculator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#090b10;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:430px;
background:#151a22;
border:2px solid #ff8c00;
border-radius:25px;
padding:25px;
box-shadow:
0 0 15px #008cff,
0 0 35px rgba(0,140,255,.35);
}

h1{
text-align:center;
color:#ff8c00;
margin-bottom:25px;
font-size:38px;
text-shadow:0 0 12px #ff8c00;
}

.head{
display:grid;
grid-template-columns:80px 1fr 1fr;
margin-bottom:15px;
color:#fff;
font-size:20px;
font-weight:bold;
text-align:center;
}

.row{
display:grid;
grid-template-columns:80px 1fr 1fr;
gap:12px;
align-items:center;
margin:18px 0;
}

.label{
font-size:32px;
color:#fff;
font-weight:bold;
}

input{
width:100%;
height:55px;
background:#0d1117;
border:2px solid #008cff;
border-radius:15px;
color:#fff;
font-size:28px;
text-align:center;
outline:none;
box-shadow:0 0 12px rgba(0,140,255,.3);
}

.output{
height:55px;
display:flex;
justify-content:center;
align-items:center;
background:#0d1117;
border:2px solid #ff8c00;
border-radius:15px;
color:#ff8c00;
font-size:28px;
font-weight:bold;
box-shadow:0 0 12px rgba(255,140,0,.3);
}
.totalBox{
margin-top:20px;
background:#0d1117;
border:2px solid #00bfff;
border-radius:18px;
padding:18px;
box-shadow:0 0 15px rgba(0,191,255,.4);
}

.totalRow{
display:flex;
justify-content:space-between;
margin:10px 0;
font-size:24px;
font-weight:bold;
color:#fff;
}

.totalValue{
color:#00ffff;
text-shadow:0 0 10px #00ffff;
}

.resetBtn{
width:100%;
height:55px;
margin-top:20px;
background:#ff8c00;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
color:#fff;
cursor:pointer;
box-shadow:0 0 18px #ff8c00;
transition:.25s;
}

.resetBtn:hover{
transform:scale(1.03);
box-shadow:0 0 28px #ff8c00;
}

input:focus{
border-color:#ff8c00;
box-shadow:0 0 15px #ff8c00;
}

::placeholder{
color:#666;
}

</style>
</head>

<body>

<div class="container">

<h1>calculator</h1>

<div class="head">
<div>₹</div>
<div>Pieces</div>
<div>Amount</div>
</div>

<div class="row">
<div class="label">500</div>
<input type="number" id="p500" placeholder="0">
<div class="output" id="a500">₹0</div>
</div>

<div class="row">
<div class="label">200</div>
<input type="number" id="p200" placeholder="0">
<div class="output" id="a200">₹0</div>
</div>

<div class="row">
<div class="label">100</div>
<input type="number" id="p100" placeholder="0">
<div class="output" id="a100">₹0</div>
</div>

<div class="row">
<div class="label">50</div>
<input type="number" id="p50" placeholder="0">
<div class="output" id="a50">₹0</div>
</div>
<div class="totalBox">

<div class="totalRow">
<span>Total Amount</span>
<span class="totalValue" id="grandTotal">₹0</span>
</div>

<div class="totalRow" style="font-size:18px;">
<span>Total Pieces</span>
<span id="totalPieces">0</span>
</div>

</div>

<button class="resetBtn" onclick="resetAll()">🔄 Reset</button>

</div>

<script>

const ids=["500","200","100","50"];

ids.forEach(id=>{
const input=document.getElementById("p"+id);

input.addEventListener("focus",()=>{
if(input.value=="0") input.value="";
});

input.addEventListener("input",calculate);
});

function calculate(){

let total=0;
let pieces=0;

ids.forEach(id=>{

let qty=parseInt(document.getElementById("p"+id).value)||0;

let amount=qty*parseInt(id);

document.getElementById("a"+id).innerHTML=
"₹"+amount.toLocaleString("en-IN");

total+=amount;
pieces+=qty;

});

document.getElementById("grandTotal").innerHTML=
"₹"+total.toLocaleString("en-IN");

document.getElementById("totalPieces").innerHTML=pieces;

}
function resetAll(){

ids.forEach(id=>{

document.getElementById("p"+id).value="";
document.getElementById("a"+id).innerHTML="₹0";

});

document.getElementById("grandTotal").innerHTML="₹0";
document.getElementById("totalPieces").innerHTML="0";

}

calculate();

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
